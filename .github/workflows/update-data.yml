name: Update ADP Data

on:
  schedule:
    - cron: '0 12 * * *'  # 8 AM ET daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/fetch-all.js
      - name: Commit and push if changed
        run: |
          git config user.name "ADP Bot"
          git config user.email "adp-bot@github.com"
          git add src/data/
          git diff --staged --quiet || git commit -m "chore: update ADP data (auto)"
          git push